name: Meal Planner Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an in-progress publication before starting another for this branch.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify software and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked development dependencies
        run: npm ci

      - name: Check sources and local asset references
        run: npm run check

      - name: Verify software behavior
        run: npm test

      - name: Build the static distribution
        run: npm run build

      - name: Verify distribution bytes
        run: npm run verify:build

      - name: Upload only the compiled app
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
          # The verified dist directory contains the generated .nojekyll marker.
          include-hidden-files: true

  deploy:
    name: Publish and verify returned URL
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the same revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked development dependencies
        run: npm ci

      # Rebuild the same source revision to verify the exact published bytes.
      - name: Prepare expected release for HTTP verification
        run: npm run build

      - name: Verify expected distribution
        run: npm run verify:build

      - name: Read the configured Pages site
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Publish the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify the returned public URL
        env:
          MEAL_PLANNER_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-release.mjs --url "$MEAL_PLANNER_URL"
